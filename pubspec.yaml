name: club_fitness
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  dio: ^5.9.2
  talker_dio_logger: ^5.1.17
  go_router: ^17.2.3
  animations: ^2.2.0
  flutter_animate: ^4.5.2
  dartz: ^0.10.1
  html: ^0.15.6
  toastification: ^3.0.3
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  video_player: ^2.10.1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  get_it: ^9.2.1
  flutter_cache_manager: ^3.4.1
  share_plus: ^12.0.2
  http: ^1.6.0
  liquid_pull_to_refresh: ^3.0.1
  video_player_win: ^3.2.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7+1
  internet_connection_checker_plus: ^3.0.1
  photo_view: ^0.15.0
  fuzzy: ^0.5.1
  string_similarity: ^2.2.0
  app_links: ^6.4.1
  flutter_launcher_icons: ^0.14.4
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_auth: ^6.5.6
  flutter_typeahead: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/videos/

  fonts:
  - family: Flaticon
    fonts:
      - asset: assets/fonts/flaticon.ttf
  - family: FlaticonChubby
    fonts:
      - asset: assets/fonts/flaticon-chubby.ttf
  - family: FlaticonRounded
    fonts:
      - asset: assets/fonts/flaticon-rounded.ttf
